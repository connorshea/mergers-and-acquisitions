name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a superseded run of the same PR / branch; runs on main all complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Format, lint, and type-check
        run: pnpm exec vp check

      - name: Run tests
        run: pnpm exec vp test

      - name: Type-check project references
        run: pnpm exec tsc -b

      - name: Build
        run: pnpm exec vp build

      - name: Find unused files, exports, and dependencies
        run: pnpm exec knip

  # The scorer's offline regression gate: scores every labelled pair under
  # eval-data/ and fails only if a pair the checked-in baseline got right is now
  # wrong. Needs no DB or network, so it runs on its own. See scripts/eval-score.ts
  # for how to update the baseline after an intentional scoring change.
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Score the eval dataset against the baseline
        run: node scripts/eval-score.ts

  # Everything that needs a real database: apply the checked-in migrations to
  # an empty MariaDB (proving they run from scratch), fail if db/schema.ts has
  # drifted from db/migrations, and run the DB-backed tests (*.db.test.ts).
  db:
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: mergers
      DB_PASSWORD: mergers
      DB_NAME: mergers_test
    steps:
      # Started as a background step rather than a `services:` container so the
      # image pull and InnoDB startup overlap checkout and toolchain setup
      # instead of running before them. Keep the version in step with prod
      # (MariaDB 12.2 on Trove) so the tests exercise the same SQL dialect the
      # deploy will.
      - name: Start MariaDB
        id: mariadb
        background: true
        run: |
          docker run -d --name mariadb -p 3306:3306 \
            -e MARIADB_ROOT_PASSWORD=root \
            --health-cmd "healthcheck.sh --connect --innodb_initialized" \
            --health-interval 2s --health-timeout 5s --health-retries 30 \
            mariadb:12.2
          for _ in $(seq 90); do
            status=$(docker inspect -f '{{.State.Health.Status}}' mariadb)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 1
          done
          echo "::error::MariaDB did not become healthy (last status: $status)"
          docker logs mariadb
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Wait for MariaDB
        wait: mariadb

      # Create the database explicitly with utf8mb4_bin, the same as prod and
      # local dev, rather than relying on the image's default collation.
      - name: Create the test database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot <<'SQL'
          CREATE DATABASE mergers_test CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;
          CREATE USER 'mergers'@'%' IDENTIFIED BY 'mergers';
          GRANT ALL ON mergers_test.* TO 'mergers'@'%';
          SQL

      - name: Apply migrations from scratch
        run: node scripts/migrate.ts

      # `drizzle-kit generate` is offline: it diffs db/schema.ts against the
      # snapshots in db/migrations/meta and writes a new migration only if they
      # differ. Any new file here means a schema change was committed without
      # running `pnpm db:generate`.
      - name: Check for schema drift
        run: |
          pnpm exec drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            git status --porcelain db/migrations
            echo "::error::db/schema.ts has changes not captured in db/migrations. Run 'pnpm db:generate' and commit the result."
            exit 1
          fi

      # Coverage is collected here rather than in the `ci` job because this is
      # the only run that executes every test, DB-backed ones included.
      - name: Run tests including DB-backed tests
        run: pnpm exec vp test --coverage
        env:
          DB_TEST: "1"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14
