name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint, and type-check
        run: pnpm exec vp check

      - name: Run tests
        run: pnpm exec vp test --passWithNoTests

      - name: Type-check project references
        run: pnpm exec tsc -b

      # Smoke-test that the SPA still builds. No longer a prerequisite for the
      # type-check (the old Void plugin's buildStart codegen is gone), so it runs
      # last.
      - name: Build
        run: pnpm exec vp build
