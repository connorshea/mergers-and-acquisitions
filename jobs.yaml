# Settle open candidates whose items were merged or deleted on Wikidata since
# the last dump, from the wikidatawiki replica (same TOOL_REPLICA_* credentials).
# Nightly, since outside merges happen every day; before Wednesday's hunt, so
# that one skips the items that are gone.
- name: resolve-merges
  command: node jobs/resolve-merges.ts
  image: tool-mna/tool-mna:latest
  schedule: "30 2 * * *" # nightly 02:30 UTC
  mem: 1Gi
  emails: onfailure

# Weekly, because its input is: the mirror only changes with the Wednesday
# dump import, so a nightly run rescored an almost unchanged mirror six days
# out of seven. 10:00 leaves the import its full 3 h timeout (to 09:00) and
# the property sync an hour. A change to scoring (src/lib/compare.ts) reaches
# the queue at the next run, or sooner as a one-off job (see the README).
- name: hunt
  command: node --max-old-space-size=1536 jobs/hunt.ts
  image: tool-mna/tool-mna:latest
  schedule: "0 10 * * 3" # Wednesdays 10:00 UTC
  # Defaults (512Mi / 0.1 CPU) are tiny. It once needed 3Gi (a ~1.57 GiB peak
  # at 2.18M items, from the in-memory label+type blocking), but blocking now
  # groups in SQL and scoring runs a window at a time: at ~2.4M items the heap
  # stays under ~200 MB while scoring.
  mem: 2Gi
  cpu: 1
  emails: onfailure

# Resolve the pages behind same-wiki sitelink clashes on open candidates
# against the Wiki Replicas (<wiki>.analytics.db.svc.wikimedia.cloud, with the
# tool's TOOL_REPLICA_USER / TOOL_REPLICA_PASSWORD). Daily, since pages
# become redirects any day, and at a time after the weekly hunt, since the hunt
# decides which candidates are open.
- name: resolve-sitelinks
  command: node jobs/resolve-sitelinks.ts
  image: tool-mna/tool-mna:latest
  schedule: "0 12 * * *" # daily 12:00 UTC
  mem: 1Gi
  emails: onfailure

# Record who created each open candidate's items, and when, from the
# wikidatawiki replica (same TOOL_REPLICA_* credentials). At a time after the
# weekly hunt, so Wednesday's run picks up the new pairs; only new items (and
# month-old rows) are read, so the other nights' runs are quick.
- name: resolve-creations
  command: node jobs/resolve-creations.ts
  image: tool-mna/tool-mna:latest
  schedule: "30 12 * * *" # daily 12:30 UTC
  mem: 1Gi
  emails: onfailure

# The monthly Claude review (#292, server/llm-review-job.ts). Never edits
# Wikidata. None of these jobs waits on the API: each submits or collects and
# exits.
# - first-pass (1st): sends Haiku every open pair that has never had a review.
# - confirm (2nd, a day later, once Haiku's batches have ended; they take at
#   most 24 h): sends Opus only the pairs Haiku called "different".
# - collect (hourly on the 1st-3rd): writes back whatever batches have ended
#   and hides the pairs Opus also calls "different" (`auto_dismissed`). With
#   nothing pending it's one query and no API call. The 3rd's runs cover an
#   Opus batch that takes the full 24 h.
# Spend stops at LLM_MONTHLY_BUDGET_USD (default $200, both models), and if
# the API refuses for lack of credit or the Console spend limit the run stops
# cleanly: what it didn't send waits for next month. Needs the
# ANTHROPIC_API_KEY envvar.
- name: llm-review-first-pass
  command: node --max-old-space-size=768 jobs/llm-review.ts first-pass
  image: tool-mna/tool-mna:latest
  schedule: "0 6 1 * *" # 1st of the month, 06:00 UTC
  mem: 1Gi
  emails: onfailure

- name: llm-review-confirm
  command: node --max-old-space-size=768 jobs/llm-review.ts confirm
  image: tool-mna/tool-mna:latest
  schedule: "0 7 2 * *" # 2nd of the month, 07:00 UTC
  mem: 1Gi
  emails: onfailure

- name: llm-review-collect
  command: node jobs/llm-review.ts collect
  image: tool-mna/tool-mna:latest
  schedule: "30 * 1-3 * *" # hourly at :30 on the 1st to 3rd
  emails: onfailure
