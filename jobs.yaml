# Toolforge Jobs manifest. Load with:  toolforge jobs load jobs.yaml
#
# `image` must be this tool's Build Service image. After a `toolforge build`,
# find it with `toolforge images` — it looks like
# `tool-mna/tool-mna:latest`.
#
# These replace the Void crons/ + queues/ pipeline:
#   crons/sync-*.ts        -> the scheduled sync-* jobs
#   crons/ + queues/ hunt  -> the single scheduled `hunt` job (server/hunt.ts)
# The initial dump load is the `import-dump-1..4` shards run once by hand (see
# README); the same jobs then run weekly to pick up the new dump.
#
# Commands call `node` directly rather than `npm run job:*`: the launch image
# has npm but not pnpm, and npm 11 refuses to run scripts when package.json's
# devEngines.packageManager (set for Vite+) names pnpm (EBADDEVENGINES).
#
# Node sizes its default heap from the container's memory limit — a quarter of
# it — so a job with `mem: 2Gi` would run out of heap at ~512 MB. The jobs
# that hold data in memory pass --max-old-space-size explicitly (about 3/4 of
# `mem`, leaving room for buffers and the runtime).

- name: sync-properties
  command: node jobs/sync-properties.ts
  image: tool-mna/tool-mna:latest
  schedule: "0 2 * * 0" # Sundays 02:00 UTC
  emails: onfailure

- name: sync-entity-labels
  command: node jobs/sync-entity-labels.ts
  image: tool-mna/tool-mna:latest
  schedule: "15 2 * * 0" # Sundays 02:15 UTC
  emails: onfailure

- name: prune-sessions
  command: node jobs/prune-sessions.ts
  image: tool-mna/tool-mna:latest
  schedule: "45 2 * * *" # nightly 02:45 UTC
  emails: onfailure

# Rebuild the item mirror from the weekly Wikidata JSON dump, split across
# four jobs that each read a quarter of the file (`--shard i/4`, see the
# README); whichever finishes last completes the set and prunes. The dump is
# only visible with `mount: all` (build-service images get no NFS by default);
# it lands on Tuesdays. Needs the raised tool quota: 4 x 2 CPUs.
#
# Two CPUs per shard let the inflate (libuv threadpool) and the line scan
# (main thread) run side by side instead of taking turns on one core; 4 x 2
# CPUs finishes in ~35-40 min, sooner than 8 x 1 CPU (~50 min, paced by
# shards doubled up on busy nodes). Each shard stays under ~300 MB RSS.
#
# Retry once so a shard killed by a node drain restarts rather than waiting a
# week (the import is idempotent and never prunes on an incomplete set); the
# timeout catches a stuck shard before it collides with the next nightly hunt.
- name: import-dump-1
  command: node --max-old-space-size=768 jobs/import-dump.ts --shard 1/4
  image: tool-mna/tool-mna:latest
  schedule: "0 6 * * 3" # Wednesdays 06:00 UTC
  mount: all
  mem: 1Gi
  cpu: 2
  retry: 1
  timeout: 10800 # 3 h
  emails: onfailure

- name: import-dump-2
  command: node --max-old-space-size=768 jobs/import-dump.ts --shard 2/4
  image: tool-mna/tool-mna:latest
  schedule: "0 6 * * 3" # Wednesdays 06:00 UTC
  mount: all
  mem: 1Gi
  cpu: 2
  retry: 1
  timeout: 10800 # 3 h
  emails: onfailure

- name: import-dump-3
  command: node --max-old-space-size=768 jobs/import-dump.ts --shard 3/4
  image: tool-mna/tool-mna:latest
  schedule: "0 6 * * 3" # Wednesdays 06:00 UTC
  mount: all
  mem: 1Gi
  cpu: 2
  retry: 1
  timeout: 10800 # 3 h
  emails: onfailure

- name: import-dump-4
  command: node --max-old-space-size=768 jobs/import-dump.ts --shard 4/4
  image: tool-mna/tool-mna:latest
  schedule: "0 6 * * 3" # Wednesdays 06:00 UTC
  mount: all
  mem: 1Gi
  cpu: 2
  retry: 1
  timeout: 10800 # 3 h
  emails: onfailure

- name: hunt
  command: node --max-old-space-size=1536 jobs/hunt.ts
  image: tool-mna/tool-mna:latest
  schedule: "0 3 * * *" # nightly 03:00 UTC, after the syncs settle
  # Defaults (512Mi / 0.1 CPU) are tiny; the in-memory label+type blocking and
  # scoring want more headroom as the item count grows.
  mem: 2Gi
  cpu: 1
  emails: onfailure

# Resolve the pages behind same-wiki sitelink clashes on open candidates
# against the Wiki Replicas (<wiki>.analytics.db.svc.wikimedia.cloud, with the
# tool's TOOL_REPLICA_USER / TOOL_REPLICA_PASSWORD). After the hunt, since the
# hunt decides which candidates are open.
- name: resolve-sitelinks
  command: node jobs/resolve-sitelinks.ts
  image: tool-mna/tool-mna:latest
  schedule: "30 4 * * *" # nightly 04:30 UTC
  mem: 1Gi
  emails: onfailure

# Record who created each open candidate's items, and when, from the
# wikidatawiki replica (same TOOL_REPLICA_* credentials). After the hunt; only
# new items (and month-old rows) are read, so it's quick after the first run.
- name: resolve-creations
  command: node jobs/resolve-creations.ts
  image: tool-mna/tool-mna:latest
  schedule: "0 5 * * *" # nightly 05:00 UTC
  mem: 1Gi
  emails: onfailure
