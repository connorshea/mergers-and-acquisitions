# Toolforge Jobs manifest. Load with:  toolforge jobs load jobs.yaml
#
# `image` must be this tool's Build Service image. After a `toolforge build`,
# find it with `toolforge images` — it looks like
# `tool-mna/tool-mna:latest`.
#
# These replace the Void crons/ + queues/ pipeline:
#   crons/sync-*.ts        -> the scheduled sync-* jobs
#   crons/ + queues/ hunt  -> the single scheduled `hunt` job (server/hunt.ts)
# The initial dump load is the `import-dump-1..6` workers run once by hand (see
# README); the same jobs then run weekly to pick up the new dump. They are
# identical workers sharing a segment queue, so adding or removing one needs
# no other change (each only needs its own name after `--worker`).
#
# Commands call `node` directly rather than `npm run job:*`: the launch image
# has npm but not pnpm, and npm 11 refuses to run scripts when package.json's
# devEngines.packageManager (set for Vite+) names pnpm (EBADDEVENGINES).
#
# Node sizes its default heap from the container's memory limit — a quarter of
# it — so a job with `mem: 2Gi` would run out of heap at ~512 MB. The jobs
# that hold data in memory pass --max-old-space-size explicitly (about 3/4 of
# `mem`, leaving room for buffers and the runtime).

- name: sync-properties
  command: node jobs/sync-properties.ts
  image: tool-mna/tool-mna:latest
  schedule: "0 2 * * 0" # Sundays 02:00 UTC
  emails: onfailure

# Label the value QIDs the weekly dump import brought in. It runs after the
# import (Wednesdays 06:00, usually done in 30-40 min, 3 h timeout) so new
# pairs show names, not QIDs, by the time Thursday's hunt surfaces them; the
# detail page reads labels per request, so nothing needs rescoring.
- name: sync-entity-labels
  command: node --max-old-space-size=768 jobs/sync-entity-labels.ts
  image: tool-mna/tool-mna:latest
  schedule: "0 10 * * 3" # Wednesdays 10:00 UTC
  emails: onfailure
  # The 512Mi default (a ~270 MB heap) ran out at 3.6M items: the 2.77M
  # referenced QIDs plus the 1.89M left to look up on QLever, and its copy.
  mem: 1Gi

- name: prune-sessions
  command: node jobs/prune-sessions.ts
  image: tool-mna/tool-mna:latest
  schedule: "45 2 * * *" # nightly 02:45 UTC
  emails: onfailure

# Rebuild the item mirror from the weekly Wikidata JSON dump, split across
# six jobs that each read a sixth of the file (`--shard i/6`, see the
# README); whichever finishes last completes the set and prunes. The dump is
# only visible with `mount: all` (build-service images get no NFS by default);
# it lands on Tuesdays. Needs the raised tool quota: 6 x 2 CPUs and 6 x 512Mi,
# which fits beside the webservice because no other job runs at this hour.
#
# Two CPUs per shard let the inflate (libuv threadpool) and the line scan
# (main thread) run side by side instead of taking turns on one core; each
# shard keeps both busy (~1.87 of 2 CPUs under `kubectl top`), so the pass
# scales by adding shards, not CPUs per shard. 4 x 2 CPUs took ~35-40 min;
# 8 x 1 CPU was slower (~50 min, paced by shards doubled up on busy nodes).
# Each shard stays under ~300 MB RSS (the prune after the pass holds only the
# QIDs that left the dump), hence 512Mi with a 384 MB heap.
#
# Retry once so a shard killed by a node drain restarts rather than waiting a
# week (the import is idempotent and never prunes on an incomplete set); the
# timeout catches a stuck shard before it collides with the next nightly hunt.
- name: import-dump-1
  command: node --max-old-space-size=384 jobs/import-dump.ts --worker import-dump-1
  image: tool-mna/tool-mna:latest
  schedule: "0 6 * * 3" # Wednesdays 06:00 UTC
  mount: all
  mem: 512Mi
  cpu: 2
  retry: 1
  timeout: 10800 # 3 h
  emails: onfailure

- name: import-dump-2
  command: node --max-old-space-size=384 jobs/import-dump.ts --worker import-dump-2
  image: tool-mna/tool-mna:latest
  schedule: "0 6 * * 3" # Wednesdays 06:00 UTC
  mount: all
  mem: 512Mi
  cpu: 2
  retry: 1
  timeout: 10800 # 3 h
  emails: onfailure

- name: import-dump-3
  command: node --max-old-space-size=384 jobs/import-dump.ts --worker import-dump-3
  image: tool-mna/tool-mna:latest
  schedule: "0 6 * * 3" # Wednesdays 06:00 UTC
  mount: all
