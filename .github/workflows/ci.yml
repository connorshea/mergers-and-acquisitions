name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a superseded run of the same PR / branch; runs on main all complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint, and type-check
        run: pnpm exec vp check

      - name: Run tests
        run: pnpm exec vp test

      - name: Type-check project references
        run: pnpm exec tsc -b

      - name: Build
        run: pnpm exec vp build

  # Everything that needs a real database: apply the checked-in migrations to
  # an empty MariaDB (proving they run from scratch), fail if db/schema.ts has
  # drifted from db/migrations, and run the DB-backed tests (*.db.test.ts).
  db:
    runs-on: ubuntu-latest
    services:
      mariadb:
        # Keep the major in step with Toolforge's ToolsDB so the tests exercise
        # the same SQL dialect the deploy will.
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: mergers
      DB_PASSWORD: mergers
      DB_NAME: mergers_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The service image can't be given a default collation, so create the
      # database explicitly with utf8mb4_bin — the same as ToolsDB and local dev.
      - name: Create the test database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot <<'SQL'
          CREATE DATABASE mergers_test CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;
          CREATE USER 'mergers'@'%' IDENTIFIED BY 'mergers';
          GRANT ALL ON mergers_test.* TO 'mergers'@'%';
          SQL

      - name: Apply migrations from scratch
        run: node scripts/migrate.ts

      # `drizzle-kit generate` is offline: it diffs db/schema.ts against the
      # snapshots in db/migrations/meta and writes a new migration only if they
      # differ. Any new file here means a schema change was committed without
      # running `pnpm db:generate`.
      - name: Check for schema drift
        run: |
          pnpm exec drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            git status --porcelain db/migrations
            echo "::error::db/schema.ts has changes not captured in db/migrations. Run 'pnpm db:generate' and commit the result."
            exit 1
          fi

      - name: Run tests including DB-backed tests
        run: pnpm exec vp test
        env:
          DB_TEST: "1"
