name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Void generates its route/queue type declarations (.void/routes.d.ts,
      # .void/queues.d.ts) in the Vite plugin's `buildStart` hook — i.e. during
      # a build, not during `vp check`. On a fresh checkout those files don't
      # exist yet, and the generated .void/tsconfig.json references them, so a
      # type-check before any build fails with "File '.void/routes.d.ts' not
      # found". Build first so the codegen runs before the type-check.
      - name: Build
        run: pnpm exec vp build

      - name: Format, lint, and type-check
        run: pnpm exec vp check

      - name: Run tests
        run: pnpm exec vp test --passWithNoTests

      - name: Type-check project references
        run: pnpm exec tsc -b
